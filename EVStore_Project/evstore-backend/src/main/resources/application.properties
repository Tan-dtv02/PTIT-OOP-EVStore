server.port=8080
spring.application.name=evstore

# Doc bien moi truong tu file .env (chay tu thu muc evstore-backend hoac thu muc goc)
spring.config.import=optional:file:.env[.properties],optional:file:evstore-backend/.env[.properties]

# ====== KET NOI MYSQL: mat khau dat trong file .env ======
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:evstore}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ====== JWT: khoa bi mat dat trong file .env ======
app.jwt.secret=${JWT_SECRET}
# 1 gio
app.jwt.access-expiration-ms=3600000
# 7 ngay
app.jwt.refresh-expiration-ms=604800000
